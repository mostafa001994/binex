name: Test Server Connection

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH port
        run: |
          echo "Testing ${{ secrets.SERVER_HOST }}:22"

          timeout 10 bash -c \
            '</dev/tcp/${{ secrets.SERVER_HOST }}/22' \
            && echo "SSH port is reachable" \
            || (echo "SSH port is NOT reachable"; exit 1)
