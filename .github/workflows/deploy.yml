name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mostafa001994/binex:latest
            ghcr.io/mostafa001994/binex:${{ github.sha }}

      - name: Redeploy Portainer Stack
        shell: bash
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
        run: |
          curl --fail-with-body -X PUT \
            "${PORTAINER_URL}/api/stacks/${STACK_ID}?endpointId=${ENDPOINT_ID}" \
            -H "X-API-Key: ${PORTAINER_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
              "StackFileContent": "services:\n  binex-next:\n    image: ghcr.io/mostafa001994/binex:latest\n    container_name: binex-next\n    restart: unless-stopped\n    networks:\n      - proxy\n\nnetworks:\n  proxy:\n    external: true\n",
              "RepullImageAndRedeploy": true
            }'
